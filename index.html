    <script>
      (function() {
        try {
          var stored = localStorage.getItem('morpheus-settings');
          var state = stored ? JSON.parse(stored).state : null;
          var theme = state?.theme || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
          var uiLocale = state?.uiLocale || 'en';
          document.documentElement.lang = uiLocale;
